
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXTRADE Withdrawal</title>
<style>
body{background:#101827;color:white;font-family:Arial;padding:20px}
.box{background:#26364c;padding:18px;border-radius:12px}
input,button{width:100%;padding:14px;margin:10px 0;box-sizing:border-box;border-radius:8px}
input{background:#101827;color:white;border:1px solid #52647a}
button{background:#38d9a9;border:0}
a{color:#38d9a9}
</style>
</head>
<body>
<h1>NEXTRADE</h1>
<h2>Withdrawal</h2>
<div class="box">
<label>Withdrawal Amount</label>
<input id="amount" type="number" min="1" placeholder="Enter amount">

<label>Your TRC20 Wallet Address</label>
<input id="wallet" placeholder="Enter your TRC20 address">

<button id="submit">Submit Withdrawal Request</button>
<p id="status"></p>
</div>
<a href="dashboard.html">Back to Dashboard</a>
<script type="module" src="withdraw.js"></script>
</body>
</html>
