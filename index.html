
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTRADE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial;text-align:center}
header{padding:22px;background:#18263a}
h1{color:#38d9a9;font-size:32px}
main{padding:35px 20px}
button{width:100%;max-width:320px;padding:15px;margin:10px;border:0;border-radius:9px;background:#38d9a9;font-size:16px;font-weight:bold}
a{color:#38d9a9;text-decoration:none}
select{padding:12px;border-radius:8px;margin:15px}
</style>
</head>
<body>
<header>
<h1>NEXTRADE</h1>
<p>Welcome to NEXTRADE</p>
</header>

<main>
<h2>Customer Account</h2>
<p>Create your account or login to continue</p>

<button onclick="location.href='register.html'">Create Account</button>
<br>
<button onclick="location.href='login.html'">Login</button>

<p><a href="customer.html">Customer Home</a></p>

<h3>Select Language</h3>
<select id="language">
<option>English</option>
<option>اردو</option>
<option>العربية</option>
<option>Tagalog</option>
<option>Español</option>
<option>中文</option>
<option>Français</option>
</select>
</main>
</body>
<div id="google_translate_element"></div>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
function googleTranslateElementInit(){
new google.translate.TranslateElement({pageLanguage:'en'},'google_translate_element');
}
</script>

</html>
