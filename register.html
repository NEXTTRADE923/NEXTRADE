
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXTRADE Register</title>
<style>
body{background:#101827;color:white;font-family:Arial;padding:20px}
input,button{width:100%;padding:14px;margin:8px 0;box-sizing:border-box;border-radius:8px}
button{background:#38d9a9;border:0;font-weight:bold}
</style>
</head>
<body>
<h1>NEXTRADE</h1>
<h2>Create Account</h2>
<form id="registerForm">
<input id="name" placeholder="Full Name" required>
<input id="email" type="email" placeholder="Gmail" required>
<input id="mobile" placeholder="Mobile Number" required>
<input id="username" placeholder="Username" required>
<input id="referral" placeholder="Referral Code">
<input id="password" type="password" placeholder="Login Password" required>
<input id="pin" type="password" placeholder="Withdrawal PIN" required>
<button type="submit">Create Account</button>
</form>
<p>Already registered? <a href="login.html">Login</a></p>
<script type="module" src="register.js"></script>
</body>
</html>
