<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXTRADE Register</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.container{
  max-width:450px;
  margin:auto;
}

h1{color:#38d9a9}

input,button{
  width:100%;
  padding:14px;
  margin:9px 0;
  border-radius:8px;
  font-size:16px;
}

input{
  border:1px solid #52647a;
  background:white;
  color:#111;
}

button{
  background:#38d9a9;
  border:0;
  font-weight:bold;
}

a{color:#38d9a9}
</style>
</head>

<body>

<div class="container">

<h1>NEXTRADE</h1>
<h2>Create Account</h2>

<form id="registerForm">

<input id="name"
placeholder="Full Name" required>

<input id="email"
type="email"
placeholder="Gmail"
required>

<input id="mobile"
placeholder="Mobile Number"
required>

<input id="username"
placeholder="Username"
required>

<input id="password"
type="password"
placeholder="Login Password"
required>

<button type="submit">Create Account</button>

</form>

<p>Already registered?
<a href="login.html">Login</a>
</p>

</div>

<script type="module" src="register.js"></script>

</body>
</html>
