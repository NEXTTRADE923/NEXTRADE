
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXTRADE</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 400px;
      text-align: center;
      padding: 30px 22px;
      background: #1c293b;
      border-radius: 16px;
    }

    h1 {
      font-size: 34px;
      letter-spacing: 3px;
      color: #35d6b0;
    }

    p {
      color: #bdc8d8;
      margin-bottom: 28px;
    }

    a {
      display: block;
      padding: 14px;
      margin-top: 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .register {
      background: #35d6b0;
      color: #102027;
    }

    .login {
      border: 1px solid #35d6b0;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>NEXTRADE</h1>
    <p>Welcome to NEXTRADE</p>

    <a class="register" href="register.html">CREATE ACCOUNT</a>
    <a class="login" href="login.html">LOGIN</a>
  </div>
</body>
</html>
